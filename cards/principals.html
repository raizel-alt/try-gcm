<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCM | PERMANENT RGB CHAOS</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            animation: rgbStrobe 0.15s steps(1) infinite !important;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" style="font-size: 24px;"><text y="24">🔥</text></svg>'), auto;
        }

        @keyframes rgbStrobe {
            0% { background-color: #ff0000; }
            20% { background-color: #00ff00; }
            40% { background-color: #0000ff; }
            60% { background-color: #ffff00; }
            80% { background-color: #ff00ff; }
            100% { background-color: #00ffff; }
        }

        .top-nav { background: #333; color: white; display: flex; justify-content: space-between; padding: 10px 5%; font-size: 0.8rem; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 5%; 
            background: #fff; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: relative; 
            z-index: 10;
            animation: shake 0.1s infinite;
        }
        
        .site-logo { height: 50px; }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #333; font-weight: 900; text-transform: uppercase; }
        
        .page-header { 
            padding: 60px 0; 
            text-align: center; 
            animation: shake 0.12s infinite;
        }
        .page-header h1 { font-size: 5rem; color: white; -webkit-text-stroke: 2px black; }

        .carousel-container { padding: 50px 0; overflow: hidden; position: relative; }
        .carousel { display: flex; gap: 60px; padding: 100px 5%; overflow-x: auto; scroll-behavior: smooth; }
        .carousel::-webkit-scrollbar { display: none; }
        
        .logo-card { 
            min-width: 250px; 
            background: white; 
            padding: 20px; 
            border-radius: 0px; 
            border: 5px solid black;
            box-shadow: 15px 15px 0px rgba(0,0,0,1); 
            text-align: center; 
            flex-shrink: 0;
            /* Constant Spinning */
            animation: ultraSpin 0.4s linear infinite !important;
        }
        
        @keyframes ultraSpin {
            from { transform: rotate(0deg) scale(1.1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            50% { transform: translate(-2px, -3px) rotate(-2deg); }
            100% { transform: translate(2px, 2px) rotate(0deg); }
        }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; justify-content:center; align-items:center; z-index:20000; }
        .modal-overlay.active { display:flex; }
        .modal-content { background:black; color: lime; padding:40px; border: 10px dashed red; max-width:500px; text-align: center; }
        .close-btn { position:absolute; top:10px; right:20px; font-size:40px; color: red; cursor:pointer; background:none; border:none; }
    </style>
</head>

<body>

<div class="top-nav">
    <div>PH: +63 917 123 4567 | info@gcmarketing.com.ph</div>
    <div>MON - FRI: 9:00 AM - 6:00 PM</div>
</div>

<header>
    <a href="#"><div style="font-weight: 900; font-size: 2.5rem; color: red;">GCM!!!</div></a>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="page-header">
    <h1>PRINCIPALS</h1>
</div>

<section class="carousel-container">
    <div class="carousel" id="roster">
        <div class="logo-card" data-title="Lamoiyan Corporation">
            <div style="font-size: 60px;">🦷</div>
            <h3>Lamoiyan</h3>
        </div>
        <div class="logo-card" data-title="Unitrade Merchandise">
            <div style="font-size: 60px;">👶</div>
            <h3>Unitrade</h3>
        </div>
        <div class="logo-card" data-title="Regent Food Corp">
            <div style="font-size: 60px;">🥨</div>
            <h3>Regent</h3>
        </div>
        <div class="logo-card" data-title="LG Goods">
            <div style="font-size: 60px;">🍪</div>
            <h3>LG Goods</h3>
        </div>
        <div class="logo-card" data-title="MV Foods">
            <div style="font-size: 60px;">🧃</div>
            <h3>MV Foods</h3>
        </div>
    </div>
</section>

<div class="modal-overlay" id="principalModal">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2 id="modalTitle">Company Name</h2>
        <p>CONGRATULATIONS! YOU CLICKED A SPINNING CARD!</p>
    </div>
</div>

<script>
    const roster = document.getElementById('roster');
    const modal = document.getElementById('principalModal');
    const closeModalBtn = document.getElementById('closeModal');
    const cards = document.querySelectorAll('.logo-card');

    // Auto-scroll the carousel for extra chaos
    setInterval(() => {
        roster.scrollLeft += 5;
        if (roster.scrollLeft >= (roster.scrollWidth - roster.clientWidth)) {
            roster.scrollLeft = 0;
        }
    }, 20);

    // Modal logic
    cards.forEach(card => {
        card.addEventListener('click', () => {
            document.getElementById('modalTitle').innerText = card.dataset.title;
            modal.classList.add('active');
        });
    });

    closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
</script>

</body>
</html>
