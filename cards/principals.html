<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCM | PERMANENT RGB CHAOS</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>

    </style>
</head>

<body>

<div class="top-nav">
    <div>PH: +63 917 123 4567 | info@gcmarketing.com.ph</div>
    <div>MON - FRI: 9:00 AM - 6:00 PM</div>
</div>

<header>
    <a href="#"><div style="font-weight: 900; font-size: 2.5rem; color: red;">GCM!!!</div></a>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="page-header">
    <h1>PRINCIPALS</h1>
</div>

<section class="carousel-container">
    <div class="carousel" id="roster">
        <div class="logo-card" data-title="Lamoiyan Corporation">
            <div style="font-size: 60px;">🦷</div>
            <h3>Lamoiyan</h3>
        </div>
        <div class="logo-card" data-title="Unitrade Merchandise">
            <div style="font-size: 60px;">👶</div>
            <h3>Unitrade</h3>
        </div>
        <div class="logo-card" data-title="Regent Food Corp">
            <div style="font-size: 60px;">🥨</div>
            <h3>Regent</h3>
        </div>
        <div class="logo-card" data-title="LG Goods">
            <div style="font-size: 60px;">🍪</div>
            <h3>LG Goods</h3>
        </div>
        <div class="logo-card" data-title="MV Foods">
            <div style="font-size: 60px;">🧃</div>
            <h3>MV Foods</h3>
        </div>
    </div>
</section>

<div class="modal-overlay" id="principalModal">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2 id="modalTitle">Company Name</h2>
        <p>CONGRATULATIONS! YOU CLICKED A SPINNING CARD!</p>
    </div>
</div>

<script>
    const roster = document.getElementById('roster');
    const modal = document.getElementById('principalModal');
    const closeModalBtn = document.getElementById('closeModal');
    const cards = document.querySelectorAll('.logo-card');

    // Auto-scroll the carousel for extra chaos
    setInterval(() => {
        roster.scrollLeft += 5;
        if (roster.scrollLeft >= (roster.scrollWidth - roster.clientWidth)) {
            roster.scrollLeft = 0;
        }
    }, 20);

    // Modal logic
    cards.forEach(card => {
        card.addEventListener('click', () => {
            document.getElementById('modalTitle').innerText = card.dataset.title;
            modal.classList.add('active');
        });
    });

    closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
</script>

</body>
</html>
