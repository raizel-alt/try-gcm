<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/styles.css">
    
</head>
<body>

<div class="top-nav">
    <div>PH: +63 917 123 4567 | info@yourdomain.com</div>
    <div>MON - FRI: 9:00 AM - 6:00 PM</div>
</div>

<header>
    <a href="index.html">
        <img src="GCMLogo.png" alt="GCM Logo" class="site-logo">
    </a>
    <nav>
        <div class="nav-item active"><a href="index.html">Home</a></div>
        <div class="nav-item "><a href="about.html">About Us</a></div>
        <div class="nav-item"><a href="services.html">Services</a></div>
        <div class="nav-item"><a href="contact.html">Contact Us</a></div>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>GCM Trade Essentials</h1>
        <a href="about.html" class="btn-primary">Learn More About Us</a>
    </div>
</section>

<script>
    /* PAGE TRANSITION LOGIC */
    document.addEventListener('DOMContentLoaded', () => {
        const links = document.querySelectorAll('a');
        
        links.forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                
                if (href && href !== '#' && !href.startsWith('http')) {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    
                    setTimeout(() => {
                        window.location.href = href;
                    }, 200); 
                }
            });
        });
    });

    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            document.body.classList.remove('fade-out');
        }
    });

    const sliderImages = [
        'sample.jpg',
        'sample2.jpg',
        'sample3.jpg'
    ];
    
    let currentIndex = 0;
    const heroSection = document.querySelector('.hero');
    
    function changeBackgroundImage() {
        if (sliderImages.length > 0) {
            heroSection.style.backgroundImage = `url('${sliderImages[currentIndex]}')`;
            currentIndex = (currentIndex + 1) % sliderImages.length;
        }
    }
    
    changeBackgroundImage();
    setInterval(changeBackgroundImage, 4000);
</script>

</body>

</html>
