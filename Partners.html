<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clickable Menu with Summaries</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #fff;
  }

  :root {
    --gold: #F4B942;
  }

  .menu {
    display: flex;
    gap: 25px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 60px;
  }

  .menu-item {
    width: 100px;
    height: 100px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    cursor: pointer;
    position: relative;
    border-radius: 8px;
    filter: grayscale(100%);
    transition: filter 0.3s ease, transform 0.3s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    color: #222;
    font-weight: 700;
    font-size: 0.85rem;
    text-align: center;
    padding-bottom: 8px;
    text-shadow: 0 0 4px rgba(255 255 255 / 0.9);
  }

  .menu-item:hover {
    filter: none;
    transform: scale(1.15);
    color: var(--gold);
  }

  .menu-item span {
    position: relative;
    z-index: 2;
    background: rgba(255 255 255 / 0.85);
    padding: 3px 6px;
    border-radius: 4px;
    width: 90%;
    user-select: none;
  }

  /* Popup background */
  .popup-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  /* Show popup */
  .popup-bg.active {
    display: flex;
  }

  /* Popup container */
  .popup {
    background: white;
    padding: 25px 30px;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
    text-align: center;
  }

  .popup h2 {
    margin-top: 0;
    color: var(--gold);
  }

  .popup p {
    margin: 15px 0 0 0;
    color: #333;
    font-size: 1rem;
    line-height: 1.4;
  }

  .popup-close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 22px;
    font-weight: bold;
    color: #666;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s ease;
  }

  .popup-close:hover {
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="menu">
  <div class="menu-item" style="background-image:url('3m.png');" data-name="3M" data-summary="3M is a global innovation company known for its wide range of products in safety, healthcare, and consumer goods.">
    <span>3M</span>
  </div>
  <div class="menu-item" style="background-image:url('bayer.png');" data-name="Bayer" data-summary="Bayer is a multinational company specializing in pharmaceuticals, consumer health, agricultural products, and biotechnology.">
    <span>Bayer</span>
  </div>
  <div class="menu-item" style="background-image:url('history.png');" data-name="History" data-summary="Discover the rich history and milestones of our company, shaping our legacy and future.">
    <span>History</span>
  </div>
  <div class="menu-item" style="background-image:url('jsu.png');" data-name="JSU" data-summary="JSU is recognized for its dedication to quality and innovation across various product lines.">
    <span>JSU</span>
  </div>
  <div class="menu-item" style="background-image:url('lamoiyan.png');" data-name="Lamoiyan" data-summary="Lamoiyan offers trusted personal care and household products known throughout the region.">
    <span>Lamoiyan</span>
  </div>
  <div class="menu-item" style="background-image:url('mandv.png');" data-name="Mission & Vision" data-summary="Our mission and vision guide us towards sustainable growth, innovation, and social responsibility.">
    <span>Mission & Vision</span>
  </div>
  <div class="menu-item" style="background-image:url('mars.png');" data-name="Mars" data-summary="Mars is a global manufacturer of confectionery, pet food, and other food products.">
    <span>Mars</span>
  </div>
  <div class="menu-item" style="background-image:url('maunlad.png');" data-name="Maunlad" data-summary="Maunlad focuses on community development and uplifting local enterprises.">
    <span>Maunlad</span>
  </div>
  <div class="menu-item" style="background-image:url('ncm.png');" data-name="NCM" data-summary="NCM provides innovative solutions in technology and manufacturing sectors.">
    <span>NCM</span>
  </div>
  <div class="menu-item" style="background-image:url('principals.png');" data-name="Principals" data-summary="Our principals are committed to excellence and integrity in all business endeavors.">
    <span>Principals</span>
  </div>
  <div class="menu-item" style="background-image:url('reckitt.png');" data-name="Reckitt" data-summary="Reckitt develops health, hygiene, and nutrition products trusted worldwide.">
    <span>Reckitt</span>
  </div>
  <div class="menu-item" style="background-image:url('regal.png');" data-name="Regal" data-summary="Regal is known for premium quality food and beverage products.">
    <span>Regal</span>
  </div>
  <div class="menu-item" style="background-image:url('regent.png');" data-name="Regent" data-summary="Regent delivers excellence in household and personal care products.">
    <span>Regent</span>
  </div>
  <div class="menu-item" style="background-image:url('template.png');" data-name="Template" data-summary="Template is our versatile brand for customizable solutions and services.">
    <span>Template</span>
  </div>
</div>

<!-- Popup -->
<div class="popup-bg" id="popup">
  <div class="popup">
    <div class="popup-close" id="popup-close">&times;</div>
    <h2 id="popup-title">Title</h2>
    <p id="popup-text">Summary text goes here...</p>
  </div>
</div>

<script>
  const menuItems = document.querySelectorAll('.menu-item');
  const popupBg = document.getElementById('popup');
  const popupTitle = document.getElementById('popup-title');
  const popupText = document.getElementById('popup-text');
  const popupClose = document.getElementById('popup-close');

  menuItems.forEach(item => {
    item.addEventListener('click', () => {
      const name = item.getAttribute('data-name');
      const summary = item.getAttribute('data-summary');
      popupTitle.textContent = name;
      popupText.textContent = summary;
      popupBg.classList.add('active');
    });
  });

  popupClose.addEventListener('click', () => {
    popupBg.classList.remove('active');
  });

  // Close popup when clicking outside the popup content
  popupBg.addEventListener('click', (e) => {
    if (e.target === popupBg) {
      popupBg.classList.remove('active');
    }
  });
</script>

</body>
</html>
