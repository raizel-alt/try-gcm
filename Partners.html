<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Summaries</title>
<style>
body { font-family: Arial,sans-serif; margin:40px; background:#fff; }
:root { --gold:#F4B942; }

.menu { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.menu-item { width:100px; height:100px; background-size:contain; background-repeat:no-repeat; background-position:center; cursor:pointer; border-radius:8px; filter:grayscale(100%); transition:filter 0.3s, transform 0.3s; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; text-align:center; font-weight:700; font-size:0.85rem; text-shadow:0 0 4px rgba(255,255,255,0.9); }
.menu-item:hover { filter:none; transform:scale(1.15); color:var(--gold); }
.menu-item span { background:rgba(255,255,255,0.85); padding:3px 6px; border-radius:4px; width:90%; }

.popup-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index:9999; }
.popup-bg.active { display:flex; }
.popup { background:white; padding:25px 30px; max-width:400px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.3); position:relative; text-align:center; }
.popup h2 { margin-top:0; color:var(--gold); }
.popup p { margin:15px 0 0 0; color:#333; font-size:1rem; line-height:1.4; }
.popup-close { position:absolute; top:10px; right:15px; font-size:22px; font-weight:bold; color:#666; cursor:pointer; transition:color 0.2s; }
.popup-close:hover { color:var(--gold); }
</style>
</head>
<body>

<div class="menu">
  <div class="menu-item" style="background-image:url('3m.png');" data-name="3M" data-summary="3M is a global innovation company known for safety, healthcare, and consumer products."><span>3M</span></div>
  <div class="menu-item" style="background-image:url('bayer.png');" data-name="Bayer" data-summary="Bayer specializes in pharmaceuticals, consumer health, and agriculture."><span>Bayer</span></div>
  <div class="menu-item" style="background-image:url('history.png');" data-name="History" data-summary="Our company history and milestones shaping our legacy."><span>History</span></div>
  <div class="menu-item" style="background-image:url('jsu.png');" data-name="JSU" data-summary="JSU is recognized for quality and innovation in its products."><span>JSU</span></div>
  <div class="menu-item" style="background-image:url('lamoiyan.png');" data-name="Lamoiyan" data-summary="Lamoiyan provides trusted personal care and household products."><span>Lamoiyan</span></div>
  <div class="menu-item" style="background-image:url('mandv.png');" data-name="Mission & Vision" data-summary="Our mission and vision guide sustainable growth and social responsibility."><span>Mission & Vision</span></div>
  <div class="menu-item" style="background-image:url('mars.png');" data-name="Mars" data-summary="Mars manufactures confectionery, pet food, and other food products globally."><span>Mars</span></div>
  <div class="menu-item" style="background-image:url('maunlad.png');" data-name="Maunlad" data-summary="Maunlad focuses on community development and local enterprise support."><span>Maunlad</span></div>
  <div class="menu-item" style="background-image:url('ncm.png');" data-name="NCM" data-summary="NCM provides innovative technology and manufacturing solutions."><span>NCM</span></div>
  <div class="menu-item" style="background-image:url('principals.png');" data-name="Principals" data-summary="Our principals are committed to excellence and integrity."><span>Principals</span></div>
  <div class="menu-item" style="background-image:url('reckitt.png');" data-name="Reckitt" data-summary="Reckitt develops trusted health, hygiene, and nutrition products."><span>Reckitt</span></div>
  <div class="menu-item" style="background-image:url('regal.png');" data-name="Regal" data-summary="Regal is known for premium quality food and beverage products."><span>Regal</span></div>
  <div class="menu-item" style="background-image:url('regent.png');" data-name="Regent" data-summary="Regent delivers excellence in household and personal care products."><span>Regent</span></div>
  <div class="menu-item" style="background-image:url('template.png');" data-name="Template" data-summary="Template is our versatile brand for customizable solutions and services."><span>Template</span></div>
</div>

<div class="popup-bg" id="popup">
  <div class="popup">
    <div class="popup-close" id="popup-close">&times;</div>
    <h2 id="popup-title">Title</h2>
    <p id="popup-text">Summary text goes here...</p>
  </div>
</div>

<script>
const menuItems = document.querySelectorAll('.menu-item');
const popupBg = document.getElementById('popup');
const popupTitle = document.getElementById('popup-title');
const popupText = document.getElementById('popup-text');
const popupClose = document.getElementById('popup-close');

menuItems.forEach(item => {
  item.addEventListener('click', () => {
    popupTitle.textContent = item.dataset.name;
    popupText.textContent = item.dataset.summary;
    popupBg.classList.add('active');
  });
});

popupClose.addEventListener('click', () => popupBg.classList.remove('active'));
popupBg.addEventListener('click', e => { if(e.target===popupBg) popupBg.classList.remove('active'); });
</script>

</body>
</html>
