<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clickable Menu with Background PNGs</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #fff;
  }

  /* Container for menu */
  .menu {
    display: flex;
    gap: 25px;
    justify-content: center;
    margin-bottom: 60px;
  }

  /* Each clickable item */
  .menu-item {
    width: 100px;
    height: 100px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    cursor: pointer;
    position: relative;
    border-radius: 8px;
    filter: grayscale(100%);
    transition: filter 0.3s ease, transform 0.3s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    color: #222;
    font-weight: 700;
    font-size: 0.85rem;
    text-align: center;
    padding-bottom: 8px;
    text-shadow: 0 0 4px rgba(255 255 255 / 0.9);
  }

  /* Hover highlight */
  .menu-item:hover {
    filter: none;
    transform: scale(1.15);
    color: var(--gold, #F4B942);
  }

  /* Label under each item */
  .menu-item span {
    position: relative;
    z-index: 2;
    background: rgba(255 255 255 / 0.85);
    padding: 3px 6px;
    border-radius: 4px;
    width: 90%;
    user-select: none;
  }
</style>
</head>
<body>

<div class="menu">
  <a href="#" class="menu-item" style="background-image:url('3m.png');"><span>3M</span></a>
  <a href="#" class="menu-item" style="background-image:url('bayer.png');"><span>Bayer</span></a>
  <a href="history.html" class="menu-item" style="background-image:url('history.png');"><span>History</span></a>
  <a href="#" class="menu-item" style="background-image:url('jsu.png');"><span>JSU</span></a>
  <a href="#" class="menu-item" style="background-image:url('lamoiyan.png');"><span>Lamoiyan</span></a>
  <a href="mandv.html" class="menu-item" style="background-image:url('mandv.png');"><span>Mission & Vision</span></a>
  <a href="#" class="menu-item" style="background-image:url('mars.png');"><span>Mars</span></a>
  <a href="#" class="menu-item" style="background-image:url('maunlad.png');"><span>Maunlad</span></a>
  <a href="#" class="menu-item" style="background-image:url('ncm.png');"><span>NCM</span></a>
  <a href="principals.html" class="menu-item" style="background-image:url('principals.png');"><span>Principals</span></a>
  <a href="#" class="menu-item" style="background-image:url('reckitt.png');"><span>Reckitt</span></a>
  <a href="#" class="menu-item" style="background-image:url('regal.png');"><span>Regal</span></a>
  <a href="#" class="menu-item" style="background-image:url('regent.png');"><span>Regent</span></a>

</div>

</body>
</html>
